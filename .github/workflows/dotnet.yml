name: PaintStore CI

on:
  push:
    branches:
      - main
      - week4
      - 'feature/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    permissions:
      contents: read

    jobs:
      build-and-test:
        name: Build and Test
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repository
            uses: actions/checkout@v7

          - name: Setup .NET 10
            uses: actions/setup-dotnet@v6
            with:
              dotnet-version: '10.0.x'

          - name: Restore dependencies
            run: dotnet restore PaintStore/PaintStore.Tests/PaintStore.Tests.csproj

          - name: Build API
            run: dotnet build PaintStore/PaintStore.API/PaintStore.API.csproj --configuration Release --no-restore

          - name: Run unit tests
            run: dotnet test PaintStore/PaintStore.Tests/PaintStore.Tests.csproj --configuration Release --no-restore

          - name: Publish API
            run: dotnet publish PaintStore/PaintStore.API/PaintStore.API.csproj --configuration Release --no-restore --output ./publish

          - name: Upload published API
            uses: actions/upload-artifact@v4
            with:
              name: paintstore-api
              path: ./publish/
